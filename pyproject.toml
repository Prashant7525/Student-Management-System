[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "student-management-system"
version = "1.0.0"
description = "A modular Python-based Student Management System with JSON persistence, validation, testing, and CLI interface."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "PRASHANT KUMAR" }
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "httpx2"
]

[project.scripts]
student-management = "student_management.main:main"

[tool.setuptools.packages.find]
where = ["src"]